<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pm-grad-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D63FF"/>
      <stop offset="100%" stop-color="#0B3CC1"/>
    </linearGradient>
    <linearGradient id="filament-glow-mask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="text-shadow-mask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable cropping -->
  <rect width="512" height="512" fill="url(#pm-grad-mask)"/>

  <!-- Central safe zone content (within central 80% circle) -->
  <!-- Top: "Print" -->
  <text
    x="256"
    y="224"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-weight="900"
    font-size="98"
    fill="#FFFFFF"
    letter-spacing="2"
    filter="url(#text-shadow-mask)"
  >Print</text>

  <!-- Divider filament layer line -->
  <rect x="166" y="258" width="180" height="7" rx="3.5" fill="url(#filament-glow-mask)"/>
  <circle cx="256" cy="261.5" r="5.5" fill="#38BDF8"/>

  <!-- Bottom: "Mais" -->
  <text
    x="256"
    y="358"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-weight="900"
    font-size="104"
    fill="#38BDF8"
    letter-spacing="3"
    filter="url(#text-shadow-mask)"
  >Mais</text>
</svg>